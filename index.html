const SAVE='nsGalacticFrontier22',RUN='nsGalacticFrontierRun40',BEST='ns21B';

const SECTORS=[{name:'FRONTIER DEFENSE',color:'#55ddff',bg:'#06182d'},{name:'SHATTERED BELT',color:'#ffb15d',bg:'#22140c'},{name:'PHANTOM NEBULA',color:'#bd8cff',bg:'#170d30'},{name:'CRIMSON EXPANSE',color:'#ff6380',bg:'#280b1a'},{name:'LAST HORIZON',color:'#ffe08a',bg:'#251d0c'}];
const WEAPONS={pulse:{name:'PULSE CANNON',symbol:'✦',color:'#5feaff',desc:'Rapid focused bolts. Upgrades widen the firing pattern.'},missile:{name:'MISSILE SWARM',symbol:'➤',color:'#ffad65',desc:'Homing rockets seek enemies and armored turrets.'},arc:{name:'ARC LIGHTNING',symbol:'ϟ',color:'#c29aff',desc:'Electricity jumps between nearby targets.'},drone:{name:'ORBITAL DRONE',symbol:'◉',color:'#75ffd3',desc:'An orbiting gun platform fires independently.'},nova:{name:'NOVA DISC',symbol:'✺',color:'#ff83cc',desc:'Expanding energy discs cut through enemy groups.'},rail:{name:'RAIL LANCE',symbol:'⟡',color:'#ffe18a',desc:'Heavy piercing shots with precise impact.'}};
const PASSIVES={core:{name:'OVERCHARGED CORE',symbol:'◆',desc:'+14% damage to all weapons per level.'},haste:{name:'QUANTUM CYCLER',symbol:'↻',desc:'+12% weapon firing speed per level.'},armor:{name:'SHIELD MATRIX',symbol:'⬡',desc:'Increase maximum shield and repair some damage.'},magnet:{name:'SALVAGE ARRAY',symbol:'✧',desc:'Gain +12% XP per level.'},focus:{name:'TARGETING AI',symbol:'◎',desc:'Boost projectile speed and homing accuracy.'}};
const TYPES={scout:{hp:24,speed:94,r:13,color:'#ff5c91',xp:4},drone:{hp:15,speed:125,r:10,color:'#66ead7',xp:3},interceptor:{hp:39,speed:105,r:15,color:'#ffce65',xp:6},bomber:{hp:96,speed:52,r:23,color:'#ff925c',xp:12},sniper:{hp:58,speed:60,r:17,color:'#c0a2ff',xp:9},frigate:{hp:135,speed:45,r:24,color:'#66bfff',xp:15},hunter:{hp:78,speed:112,r:17,color:'#ff6172',xp:12},carrier:{hp:175,speed:40,r:27,color:'#e48aff',xp:20}};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let campaign={level:1,credits:0,ship:0,upgrades:{dmg:0,spd:0,shd:0,msl:0}},best=0,state=null,mode='hub',last=0,accSave=0,frame=0,stars=[],touchX=null,keys={};
function load(){try{const old=JSON.parse(localStorage.getItem(SAVE)||'null');if(old){campaign={...campaign,...old,upgrades:{...campaign.upgrades,...old.upgrades}};campaign.level=clamp(Number(campaign.level)||1,1,25);campaign.ship=clamp(Number(campaign.ship)||0,0,3);campaign.credits=Math.max(0,Number(campaign.credits)||0);for(const k of Object.keys(campaign.upgrades))campaign.upgrades[k]=clamp(Number(campaign.upgrades[k])||0,0,5);}}catch(e){}try{best=Number(localStorage.getItem(BEST))||0;}catch(e){}}
function saveCampaign(){try{localStorage.setItem(SAVE,JSON.stringify(campaign));}catch(e){}}
function saveRun(){if(!state||!['playing','cards','paused'].includes(mode))return;try{localStorage.setItem(RUN,JSON.stringify({version:40,mission:campaign.level,state}));}catch(e){}}
function savedRun(){try{const s=JSON.parse(localStorage.getItem(RUN)||'null');return s?.version===40&&s.mission===campaign.level&&s.state?.player?s:null;}catch(e){return null;}}
function clearRun(){try{localStorage.removeItem(RUN);}catch(e){}}
function cost(k){return 100+125*campaign.upgrades[k];}
function duration(){return 120+(campaign.level-1)*12.5;}
function sector(){return Math.min(4,Math.floor((campaign.level-1)/5));}
function fmt(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(html){$('panel').innerHTML=html+`<div class="copyright" role="contentinfo"><strong>© 2026 Nosidom-Dev. All Rights Reserved.</strong><br>Unauthorized copying, re-uploading, or sharing without permission is prohibited.<br>This game and its source code may not be redistributed without the copyright owner’s permission, except as permitted by law.</div>`;$('overlay').classList.remove('hidden');$('hud').classList.add('hidden');$('special').classList.add('hidden');$('pause').classList.add('hidden');}
function gameUi(){ $('overlay').classList.add('hidden');$('hud').classList.remove('hidden');$('special').classList.remove('hidden');$('pause').classList.remove('hidden');}
function shipArt(g,id,x,y,scale=1,glow=true){const s=SHIPS[id]||SHIPS[0];g.save();g.translate(x,y);g.scale(scale,scale);g.shadowBlur=glow?20:0;g.shadowColor=s.color;g.strokeStyle=s.color;g.lineWidth=2.6;g.fillStyle='#0c2137';g.beginPath();if(id===0){g.moveTo(0,-36);g.lineTo(-13,-7);g.lineTo(-30,13);g.lineTo(-24,28);g.lineTo(-8,17);g.lineTo(0,25);g.lineTo(8,17);g.lineTo(24,28);g.lineTo(30,13);g.lineTo(13,-7);}else if(id===1){g.moveTo(0,-30);g.lineTo(-22,-23);g.lineTo(-39,3);g.lineTo(-36,29);g.lineTo(-18,19);g.lineTo(0,27);g.lineTo(18,19);g.lineTo(36,29);g.lineTo(39,3);g.lineTo(22,-23);}else if(id===2){g.moveTo(0,-43);g.lineTo(-8,-15);g.lineTo(-29,22);g.lineTo(-9,12);g.lineTo(0,32);g.lineTo(9,12);g.lineTo(29,22);g.lineTo(8,-15);}else{g.moveTo(0,-38);g.lineTo(-16,-13);g.lineTo(-32,4);g.lineTo(-24,26);g.lineTo(-9,13);g.lineTo(0,28);g.lineTo(9,13);g.lineTo(24,26);g.lineTo(32,4);g.lineTo(16,-13);}g.closePath();g.fill();g.stroke();g.fillStyle=s.color;g.beginPath();g.moveTo(0,-23);g.lineTo(-6,2);g.lineTo(0,13);g.lineTo(6,2);g.closePath();g.fill();g.shadowBlur=16;g.fillStyle='#fff4a5';g.fillRect(-15,24,7,7);g.fillRect(8,24,7,7);g.restore();}
function hub(message=''){mode='hub';state=null;const ship=SHIPS[campaign.ship],sec=SECTORS[sector()],resume=!!savedRun();show(`<div class="eyebrow">NOSIDOM-DEV PRESENTS · ARSENAL EVOLUTION 4.0</div><h1>NEON STARFIGHTER</h1><div class="sub">Build a new arsenal each mission. Choose one of three upgrades when you level up, survive the swarms, then break the commander's two armored turrets to expose its core.</div>${message?`<div class="surface" style="color:#ffe38a">${esc(message)}</div>`:''}<div class="pills"><div class="pill">MISSION ${campaign.level} / 25</div><div class="pill">CREDITS ${campaign.credits}</div><div class="pill">BEST ${best.toLocaleString()}</div></div><div class="surface"><h3>CAMPAIGN · SECTOR ${sector()+1}</h3><h2 style="color:${sec.color}">${sec.name}</h2><div class="sub">Mission ${campaign.level} · ${fmt(duration())} approach + escalation · armored commander finale</div><div class="pills">${Array.from({length:5},(_,i)=>{const n=sector()*5+i+1;return `<span class="pill" style="border-color:${n===campaign.level?'#7bf5ff':'#29415f'}">${n<campaign.level?'✓':n}</span>`}).join('')}</div></div><div class="surface"><h3>ORIGINAL SHIP HANGAR</h3><canvas class="shipCanvas" id="preview" width="640" height="170"></canvas><div class="flex"><div><h2>${ship.name}</h2><div class="sub">${ship.desc}</div><div class="sub" style="color:${ship.color};margin-top:5px">SPECIAL · ${ship.ability}</div></div><button class="btn alt" id="cycle">NEXT SHIP ›</button></div></div><div class="surface"><h3>PERMANENT TECH TREE</h3><div class="grid">${[['dmg','WEAPON CORE','Improve weapon damage'],['spd','ENGINE','Improve ship speed'],['shd','SHIELD MATRIX','Improve starting shield'],['msl','ARSENAL SYSTEM','Boost missile and drone systems']].map(([k,n,desc])=>`<div class="upgrade"><strong>${n} · LV ${campaign.upgrades[k]}/5</strong><small>${desc}</small><button class="btn" data-buy="${k}" ${campaign.upgrades[k]>=5||campaign.credits<cost(k)?'disabled':''}>${campaign.upgrades[k]>=5?'MAXED':cost(k)+' CR'}</button></div>`).join('')}</div></div><div class="btnrow"><button class="btn" id="launch">LAUNCH MISSION</button>${resume?'<button class="btn gold" id="resume">RESUME MISSION</button>':''}<button class="btn alt" id="reset">RESET CAMPAIGN</button></div><div class="sub" style="margin-top:12px">Original procedural ship and combat artwork. Saves are stored locally in this browser.</div>`);
$('launch').onclick=()=>start(false);if(resume)$('resume').onclick=()=>start(true);$('cycle').onclick=()=>{let i=campaign.ship;do{i=(i+1)%SHIPS.length;}while(campaign.level<SHIPS[i].unlock&&i!==campaign.ship);if(i===campaign.ship){hub('Next ship unlocks at Mission '+SHIPS.find(s=>campaign.level<s.unlock)?.unlock+'.');return;}campaign.ship=i;saveCampaign();hub();};$('reset').onclick=()=>{if(confirm('Erase all campaign progress, credits, upgrades, and saved mission?')){campaign={level:1,credits:0,ship:0,upgrades:{dmg:0,spd:0,shd:0,msl:0}};clearRun();saveCampaign();hub();}};document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const k=b.dataset.buy;if(campaign.upgrades[k]>=5||campaign.credits<cost(k))return;campaign.credits-=cost(k);campaign.upgrades[k]++;saveCampaign();hub();});const pv=$('preview'),g=pv.getContext('2d');g.fillStyle='#071328';g.fillRect(0,0,pv.width,pv.height);for(let i=0;i<40;i++){g.fillStyle='#4d7193';g.fillRect((i*137)%640,(i*59)%170,2,2);}shipArt(g,campaign.ship,320,88,1.6);}
function makeState(){const ship=SHIPS[campaign.ship];return {mission:campaign.level,ship:campaign.ship,time:0,kills:0,score:0,level:1,xp:0,xpNext:12,phase:0,spawn:0,enemyShots:0,player:{x:W/2,y:H-105,hp:100+ship.shield+campaign.upgrades.shd*12,maxHp:100+ship.shield+campaign.upgrades.shd*12,inv:0},weapons:{},passives:{},bullets:[],enemies:[],shots:[],particles:[],texts:[],boss:null,bossDelay:0,ability:0,abilityFlash:0,cooldowns:{},cardOptions:[],pendingLevels:0,runSeed:Math.random()};}
function start(resume){const snapshot=resume?savedRun():null;state=snapshot?.state||makeState();if(!resume)clearRun();state.player.y=H-105;state.player.x=clamp(state.player.x,28,W-28);mode='playing';gameUi();if(!resume){offerCards(true);}else if(state.cardOptions?.length){offerCards(false,true);}else{updateHud();}last=performance.now();}
function skillLevel(id){return state.weapons[id]||0;}
function cardsFor(starting){let pool=[];for(const id of Object.keys(WEAPONS)){const lv=skillLevel(id),slots=Object.keys(state.weapons).length;if(lv>=5||(!lv&&slots>=4))continue;pool.push({id,kind:'weapon',lv:lv+1});}if(!starting){for(const id of Object.keys(PASSIVES)){const lv=state.passives[id]||0,slots=Object.keys(state.passives).length;if(lv>=5||(!lv&&slots>=4))continue;pool.push({id,kind:'passive',lv:lv+1});}}
// Guaranteed choices, with a new weapon prioritized while the arsenal is incomplete.
let selected=[];if(!starting&&Object.keys(state.weapons).length<3){const newWeapons=pool.filter(p=>p.kind==='weapon'&&!skillLevel(p.id));if(newWeapons.length)selected.push(newWeapons[Math.floor(Math.random()*newWeapons.length)]);}while(selected.length<Math.min(3,pool.length)){const choices=pool.filter(p=>!selected.some(s=>s.id===p.id));if(!choices.length)break;selected.push(choices[Math.floor(Math.random()*choices.length)]);}return selected;}
function offerCards(starting=false,resuming=false){mode='cards';if(!resuming)state.cardOptions=cardsFor(starting);saveRun();const cards=state.cardOptions;show(`<div class="eyebrow center">${starting?'MISSION LOADOUT':'PILOT LEVEL '+state.level}</div><h1 class="center" style="font-size:clamp(24px,5vw,38px)">${starting?'CHOOSE YOUR FIRST WEAPON':'LEVEL UP!'}</h1><p class="sub center">${starting?'Your first weapon can defeat basic enemies on its own.':'Pick one upgrade. Your mission pauses while you choose.'}</p><div class="cardgrid">${cards.map((card,i)=>{const def=card.kind==='weapon'?WEAPONS[card.id]:PASSIVES[card.id];return `<button class="skillcard" data-card="${i}" style="border-top:3px solid ${card.kind==='weapon'?def.color:'#89f4b8'}"><em>${card.lv===1?'NEW '+card.kind.toUpperCase():card.kind.toUpperCase()+' UPGRADE'}</em><div class="symbol" style="color:${def.color||'#89f4b8'}">${def.symbol}</div><strong>${def.name}</strong><small>${def.desc}</small><div class="bottom">LEVEL ${card.lv} / 5</div></button>`;}).join('')}</div><div class="sub center">4 active weapons + 4 passive systems maximum · Weapon evolutions unlock at Level 5</div>`);document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>choose(cards[Number(b.dataset.card)]));}
function choose(card){if(mode!=='cards'||!card)return;const key=card.kind==='weapon'?'weapons':'passives';state[key][card.id]=(state[key][card.id]||0)+1;if(card.kind==='passive'&&card.id==='armor'){state.player.maxHp+=15;state.player.hp=Math.min(state.player.maxHp,state.player.hp+30);}state.cardOptions=[];sound(480,760,.14,.04);if(state.pendingLevels>0){state.pendingLevels--;state.level++;state.xpNext=Math.round(12*Math.pow(state.level,1.25));offerCards();return;}mode='playing';gameUi();updateHud();saveRun();last=performance.now();}
function xpGain(amount){state.xp+=amount*(1+.12*(state.passives.magnet||0));while(state.xp>=state.xpNext){state.xp-=state.xpNext;state.pendingLevels++;state.xpNext=Math.round(12*Math.pow(state.level+state.pendingLevels,1.25));}if(state.pendingLevels>0&&mode==='playing'){state.pendingLevels--;state.level++;state.xpNext=Math.round(12*Math.pow(state.level,1.25));offerCards();}}
function updateHud(){$('hudMission').textContent=String(campaign.level).padStart(2,'0');$('hudPhase').textContent=state.phase===2?'BOSS':state.phase===1?'ESCALATION':'APPROACH';$('hudLevel').textContent=state.level;$('hudKills').textContent=state.kills;$('hudTime').textContent=state.phase===2?'BOSS':fmt(duration()*.79-state.time);$('hpFill').style.width=clamp(state.player.hp/state.player.maxHp*100,0,100)+'%';$('xpFill').style.width=clamp(state.xp/state.xpNext*100,0,100)+'%';$('skillStrip').innerHTML=Object.entries(state.weapons).map(([k,v])=>`<span style="color:${WEAPONS[k].color}">${WEAPONS[k].symbol} ${v}${v===5?' ✨':''}</span>`).join('')+Object.entries(state.passives).map(([k,v])=>`<span>${PASSIVES[k].symbol} ${v}</span>`).join('');$('bossBox').classList.toggle('hidden',!state.boss);if(state.boss){const b=state.boss;const total=b.maxHp+b.turrets[0].maxHp+b.turrets[1].maxHp;const remaining=Math.max(0,b.hp)+b.turrets.reduce((a,t)=>a+Math.max(0,t.hp),0);$('bossFill').style.width=remaining/total*100+'%';$('bossText').textContent=(campaign.level%5===0?'SECTOR FLAGSHIP':'ARMORED COMMANDER')+' · '+SECTORS[sector()].name;$('bossStatus').textContent=b.shield?'DESTROY BOTH WING TURRETS':'CORE EXPOSED · FINAL PHASE';}$('special').textContent=state.ability>0?'RECHARGE '+Math.ceil(state.ability)+'s':SHIPS[state.ship].ability;}
function spawnEnemy(type,x,y){const t=TYPES[type],scale=1+(campaign.level-1)*.11+state.time/duration()*.42;state.enemies.push({type,x:x??rand(24,W-24),y:y??-35,hp:t.hp*scale,maxHp:t.hp*scale,r:t.r,v:t.speed*(1+sector()*.09),vx:rand(-18,18),shot:rand(1.2,3),seed:rand(0,10),color:t.color});}
function wave(){const progress=state.time/duration(),sec=sector(),difficulty=clamp(progress+sec*.12,0,1.6);const pool=sec===0?['scout','drone','interceptor','bomber']:sec===1?['scout','drone','interceptor','bomber','frigate']:sec===2?['drone','interceptor','sniper','hunter','carrier']:sec===3?['interceptor','bomber','hunter','frigate','carrier']:['hunter','drone','sniper','frigate','carrier','bomber'];const type=pool[Math.floor(Math.random()*pool.length)],n=type==='drone'?Math.round(3+difficulty*3):type==='scout'?Math.round(2+difficulty*2):type==='interceptor'?2:type==='hunter'?2:1;const mid=rand(50,Math.max(51,W-50));for(let i=0;i<n;i++)spawnEnemy(type,clamp(mid+(i-(n-1)/2)*37,22,W-22),-35-i*27);}
function spawnBoss(){const sec=sector(),major=campaign.level%5===0,scale=1+(campaign.level-1)*.16;const hp=(major?1000:610)*scale,turretHp=(major?320:190)*scale;state.boss={x:W/2,y:-110,hp,maxHp:hp,turrets:[{hp:turretHp,maxHp:turretHp,ox:-67},{hp:turretHp,maxHp:turretHp,ox:67}],shield:true,major,sec,dir:1,attack:1.4,phaseTimer:0};state.phase=2;state.enemies=[];state.shots=[];burst(W/2,125,SECTORS[sec].color,36);sound(160,60,.7,.11);}
function burst(x,y,color,n=12){for(let i=0;i<n&&state.particles.length<230;i++){const a=rand(0,Math.PI*2),v=rand(35,200);state.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.2,.7),max:.7,color,size:rand(1,4)});}}
function floatText(x,y,text,color='#8ff'){if(state.texts.length<24)state.texts.push({x,y,text,color,life:1});}
function sound(a,b,d=.12,vol=.025){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!sound.ac)sound.ac=new Audio();if(sound.ac.state==='suspended')sound.ac.resume();const o=sound.ac.createOscillator(),g=sound.ac.createGain();o.type='triangle';o.frequency.setValueAtTime(a,sound.ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,b),sound.ac.currentTime+d);g.gain.setValueAtTime(vol,sound.ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,sound.ac.currentTime+d);o.connect(g);g.connect(sound.ac.destination);o.start();o.stop(sound.ac.currentTime+d);}catch(e){}}
function nearest(x,y,range=1e9){let target=null,d=range;for(const e of state.enemies){const q=Math.hypot(e.x-x,e.y-y);if(q<d){d=q;target=e;}}if(state.boss){const b=state.boss;for(const t of b.turrets){if(t.hp<=0)continue;const p={x:b.x+t.ox,y:b.y+16,turret:t};const q=Math.hypot(p.x-x,p.y-y);if(q<d){d=q;target=p;}}if(!b.shield){const q=Math.hypot(b.x-x,b.y-y);if(q<d){d=q;target={x:b.x,y:b.y,boss:b};}}}return target;}
function damageAt(x,y,damage,radius=18,pierce=false){let hit=false;for(let i=state.enemies.length-1;i>=0;i--){const e=state.enemies[i];if(Math.hypot(e.x-x,e.y-y)<e.r+radius){e.hp-=damage;hit=true;if(e.hp<=0)killEnemy(i);if(!pierce)return true;}}const b=state.boss;if(b){for(const t of b.turrets){if(t.hp>0&&Math.hypot(b.x+t.ox-x,b.y+16-y)<radius+23){t.hp-=Math.min(damage,150);hit=true;burst(x,y,'#ffba70',3);if(t.hp<=0){t.hp=0;burst(b.x+t.ox,b.y+16,'#ffae61',30);floatText(b.x+t.ox,b.y+36,'TURRET DESTROYED','#ffcb77');sound(180,45,.3,.08);}if(!pierce)return true;}}if(!b.shield&&Math.hypot(b.x-x,b.y-y)<radius+45){b.hp-=Math.min(damage,150);hit=true;if(b.hp<=0){win();return true;}}}return hit;}
function killEnemy(i){const e=state.enemies[i];if(!e)return;state.enemies.splice(i,1);state.kills++;state.score+=Math.round(TYPES[e.type].xp*30);burst(e.x,e.y,e.color,10);if(e.type==='carrier'&&state.enemies.length<115){for(let k=0;k<3;k++)spawnEnemy('drone',e.x+rand(-22,22),e.y+rand(-15,15));}xpGain(TYPES[e.type].xp);}
function fire(id){const lv=state.weapons[id],p=state.player;if(!lv)return;const mult=(1+.14*(state.passives.core||0))*(1+.12*campaign.upgrades.dmg);const evolved=lv===5;const put=(vx,vy,dmg,color,size=4,pierce=0,homing=false,life=2)=>{if(state.bullets.length<320)state.bullets.push({x:p.x,y:p.y-28,vx,vy,damage:dmg*mult,color,size,pierce,homing,life,kind:id});};if(id==='pulse'){const count=lv>=4?5:lv>=2?3:1;for(let j=0;j<count;j++){const spread=(j-(count-1)/2)*.13;put(Math.sin(spread)*490,-Math.cos(spread)*490,24+lv*5,'#66eaff',4,evolved?1:0);}if(evolved)put(0,-540,38,'#fff2a3',6,2);}if(id==='missile'){const count=lv>=4?3:lv>=2?2:1;for(let j=0;j<count;j++)put((j-(count-1)/2)*80,-280,45+lv*12,'#ffa65e',6,0,true,3);}if(id==='arc'){const target=nearest(p.x,p.y,360);if(target){let hits=0,current=target,visited=new Set();while(current&&hits<lv+1){damageAt(current.x,current.y,(20+lv*7)*mult,12);state.particles.push({x:current.x,y:current.y,vx:0,vy:0,life:.22,max:.22,color:'#c8a4ff',size:15});visited.add(current);hits++;let next=null,d=lv===5?180:115;for(const e of state.enemies){if(visited.has(e))continue;const q=dist(e,current);if(q<d){d=q;next=e;}}current=next;}sound(780,270,.08,.018);}}if(id==='drone'){const count=lv>=4?3:lv>=2?2:1;for(let j=0;j<count;j++){const angle=state.time*2+j*Math.PI*2/count,dx=p.x+Math.cos(angle)*43,dy=p.y+Math.sin(angle)*35,target=nearest(dx,dy,450);if(target){const a=Math.atan2(target.y-dy,target.x-dx);if(state.bullets.length<320)state.bullets.push({x:dx,y:dy,vx:Math.cos(a)*410,vy:Math.sin(a)*410,damage:(22+lv*9)*mult,color:'#78ffca',size:4,pierce:evolved?1:0,life:2,kind:id});}}}if(id==='nova'){for(let j=0;j<(lv>=4?10:lv>=2?7:5);j++){const a=-Math.PI/2+(j-((lv>=4?10:lv>=2?7:5)-1)/2)*.22;put(Math.cos(a)*250,Math.sin(a)*250,22+lv*7,'#ff8fd6',8,evolved?3:1,2.4);}}if(id==='rail'){const count=lv>=3?2:1;for(let j=0;j<count;j++)put((j-(count-1)/2)*25,-640,65+lv*21,'#ffe59a',5,lv===5?12:2,1.6);}if(id!=='arc'&&Math.random()<.4)sound(350,150,.06,.012);}
function ability(){if(mode!=='playing'||state.ability>0)return;const id=state.ship,p=state.player;state.ability=20;state.abilityFlash=.65;if(id===0){p.hp=Math.min(p.maxHp,p.hp+22);p.inv=2.4;state.shots=[];burst(p.x,p.y,'#66f7ff',40);}if(id===1){for(let i=state.enemies.length-1;i>=0;i--){state.enemies[i].hp-=180+campaign.level*8;if(state.enemies[i]?.hp<=0)killEnemy(i);}if(state.boss)for(const t of state.boss.turrets)if(t.hp>0)t.hp=Math.max(1,t.hp-100);state.shots=[];burst(p.x,p.y,'#ffa34c',55);}if(id===2){p.inv=4;burst(p.x,p.y,'#bd8cff',40);}if(id===3){for(let i=state.enemies.length-1;i>=0;i--){state.enemies[i].hp-=240;if(state.enemies[i]?.hp<=0)killEnemy(i);}if(state.boss){const t=state.boss.turrets.find(t=>t.hp>0);if(t)t.hp=Math.max(1,t.hp-110);else state.boss.hp-=110;}burst(p.x,p.y,'#ffe88e',55);}sound(240,880,.3,.07);}
function hitPlayer(damage){const p=state.player;if(p.inv>0)return;p.hp-=damage;p.inv=.75;burst(p.x,p.y,'#ff6688',14);sound(180,60,.2,.06);if(p.hp<=0)fail();}
function fail(){if(mode!=='playing')return;mode='failed';clearRun();show(`<div class="eyebrow">MISSION ${campaign.level}</div><h1 style="color:#ff7598">SHIP DISABLED</h1><p class="sub">Your arsenal fell in battle. Try a different starting weapon and upgrade combination.</p><div class="pills"><span class="pill">${state.kills} KILLS</span><span class="pill">PILOT LEVEL ${state.level}</span><span class="pill">${state.score} SCORE</span></div><div class="btnrow"><button class="btn" id="retry">RETRY MISSION</button><button class="btn alt" id="hangar">HANGAR</button></div>`);$('retry').onclick=()=>start(false);$('hangar').onclick=()=>hub();}
function win(){if(mode!=='playing')return;mode='won';clearRun();const done=campaign.level,earned=250+done*75+Math.floor(state.kills*2);campaign.credits+=earned;if(done<25)campaign.level++;if(state.score>best){best=state.score;try{localStorage.setItem(BEST,String(best));}catch(e){}}saveCampaign();show(`<div class="eyebrow">MISSION ${done} COMPLETE</div><h1>VICTORY!</h1><p class="sub">The commander's armored turrets are destroyed. Its exposed core has been eliminated.</p><div class="pills"><span class="pill">+${earned} CREDITS</span><span class="pill">${state.kills} KILLS</span><span class="pill">LEVEL ${state.level}</span><span class="pill">${state.score} SCORE</span></div><div class="surface"><h3>FINAL ARSENAL</h3><div class="pills">${Object.entries(state.weapons).map(([k,v])=>`<span class="pill">${WEAPONS[k].symbol} ${WEAPONS[k].name} ${v}/5</span>`).join('')}</div></div><div class="btnrow"><button class="btn" id="hangar">${done===25?'GALAXY COMPLETE · HANGAR':'RETURN TO HANGAR'}</button></div>`);$('hangar').onclick=()=>hub(done===25?'The Last Horizon is secure. All 25 missions completed!':'Mission '+done+' cleared! Your credits are ready in the tech tree.');}
function update(dt){if(!state||mode!=='playing')return;const s=state,p=s.player;frame++;s.time+=dt;s.ability=Math.max(0,s.ability-dt);s.abilityFlash=Math.max(0,s.abilityFlash-dt);p.inv=Math.max(0,p.inv-dt);if(touchX!==null)p.x+=(clamp(touchX,24,W-24)-p.x)*Math.min(1,dt*16);const speed=(260+campaign.upgrades.spd*25)*SHIPS[s.ship].speed;if(keys.ArrowLeft||keys.a)p.x-=speed*dt;if(keys.ArrowRight||keys.d)p.x+=speed*dt;if(keys.ArrowUp||keys.w)p.y-=speed*dt;if(keys.ArrowDown||keys.s)p.y+=speed*dt;p.x=clamp(p.x,24,W-24);p.y=clamp(p.y,H*.30,H-45);
if(s.phase<2){if(s.time>=duration()*.45)s.phase=1;if(s.time>=duration()*.79){s.bossDelay=1.5;s.phase=2;s.enemies=[];s.shots=[];floatText(W/2,H*.28,'WARNING · COMMANDER','#ff7aa0');}else{s.spawn-=dt;const progress=s.time/duration();if(s.spawn<=0&&s.enemies.length<100){wave();s.spawn=clamp(1.55-progress*.85-sector()*.1,.42,1.55);}}}else if(s.bossDelay>0){s.bossDelay-=dt;if(s.bossDelay<=0)spawnBoss();}
const haste=1+.12*(s.passives.haste||0);for(const id of Object.keys(s.weapons)){s.cooldowns[id]=(s.cooldowns[id]||0)-dt;const base={pulse:.48,missile:1.6,arc:1.2,drone:.65,nova:1.5,rail:1.2}[id];if(s.cooldowns[id]<=0){fire(id);s.cooldowns[id]=base/(haste*(1+Math.max(0,s.weapons[id]-1)*.055));if(mode!=='playing')return;}}
for(let i=s.enemies.length-1;i>=0;i--){const e=s.enemies[i];e.y+=e.v*dt;e.x+=Math.sin(s.time*2.2+e.seed)*e.vx*dt;e.x=clamp(e.x,16,W-16);e.shot-=dt;if(e.shot<=0&&e.y>30&&e.y<H*.75&&s.shots.length<140){const a=Math.atan2(p.y-e.y,p.x-e.x);s.shots.push({x:e.x,y:e.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:4});e.shot=rand(2.3,4.3);}if(e.y>H+40){s.enemies.splice(i,1);continue;}if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+17){hitPlayer(14);s.enemies.splice(i,1);if(mode!=='playing')return;}}
for(let i=s.bullets.length-1;i>=0;i--){const b=s.bullets[i];b.life-=dt;if(b.homing){const t=nearest(b.x,b.y,430);if(t){const a=Math.atan2(t.y-b.y,t.x-b.x),v=310+40*(s.passives.focus||0);b.vx+=(Math.cos(a)*v-b.vx)*Math.min(1,dt*4);b.vy+=(Math.sin(a)*v-b.vy)*Math.min(1,dt*4);}}b.x+=b.vx*dt;b.y+=b.vy*dt;const hit=damageAt(b.x,b.y,b.damage,b.size,b.pierce>0);if(hit){if(b.pierce>0){b.pierce--;b.damage*=.85;}else{burst(b.x,b.y,b.color,3);s.bullets.splice(i,1);continue;}}if(b.life<=0||b.x<-70||b.x>W+70||b.y<-90||b.y>H+90)s.bullets.splice(i,1);if(mode!=='playing')return;}
for(let i=s.shots.length-1;i>=0;i--){const b=s.shots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-p.x,b.y-p.y)<20){hitPlayer(9+sector()*3);s.shots.splice(i,1);if(mode!=='playing')return;}else if(b.y>H+20||b.y<-20||b.x<-20||b.x>W+20)s.shots.splice(i,1);}
if(s.boss){const b=s.boss;b.y+=(120-b.y)*Math.min(1,dt*2);if(b.y>112){b.x+=b.dir*(b.shield?70:140)*dt;if(b.x<95){b.x=95;b.dir=1;}if(b.x>W-95){b.x=W-95;b.dir=-1;}}if(b.shield&&b.turrets.every(t=>t.hp<=0)){b.shield=false;b.phaseTimer=1.5;burst(b.x,b.y,'#62f5ff',55);floatText(b.x,b.y+55,'SHIELD BROKEN!','#67f6ff');sound(480,70,.45,.09);}b.attack-=dt;b.phaseTimer=Math.max(0,b.phaseTimer-dt);if(b.attack<=0){const positions=b.shield?b.turrets.filter(t=>t.hp>0).map(t=>({x:b.x+t.ox,y:b.y+16})):[{x:b.x,y:b.y+40},{x:b.x-34,y:b.y+20},{x:b.x+34,y:b.y+20}];for(const pos of positions){const a=Math.atan2(p.y-pos.y,p.x-pos.x);for(const offset of (b.shield?[-.14,.14]:[-.3,0,.3])){if(s.shots.length<140)s.shots.push({x:pos.x,y:pos.y,vx:Math.cos(a+offset)*190,vy:Math.sin(a+offset)*190,r:5});}}b.attack=b.shield?1.65:1.05;}if(!b.shield&&b.hp<=0){win();return;}}
for(let i=s.particles.length-1;i>=0;i--){const q=s.particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.life<=0)s.particles.splice(i,1);}for(let i=s.texts.length-1;i>=0;i--){const q=s.texts[i];q.life-=dt;q.y-=25*dt;if(q.life<=0)s.texts.splice(i,1);}updateHud();accSave+=dt;if(accSave>5){saveRun();accSave=0;}}
function background(dt){const sec=state?Math.min(4,Math.floor((state.mission-1)/5)):sector(),s=SECTORS[sec];ctx.fillStyle='#030815';ctx.fillRect(0,0,W,H);const grad=ctx.createRadialGradient(W*.48,H*.28,20,W*.5,H*.5,Math.max(W,H)*.72);grad.addColorStop(0,s.bg);grad.addColorStop(1,'#030815');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(const star of stars){star.y+=star.speed*dt*(mode==='playing'?1:.25);if(star.y>H){star.y=0;star.x=Math.random()*W;}ctx.globalAlpha=star.alpha;ctx.fillStyle=star.color;ctx.fillRect(star.x,star.y,star.size,star.size*2);}ctx.globalAlpha=1;if(sec===1){ctx.strokeStyle='#ff9e3b20';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(((i*143+frame*.3)%(W+90))-45,((i*223+frame*.8)%(H+90))-45,15+i*3,0,7);ctx.stroke();}}if(sec===2){ctx.fillStyle='#9c54ff0d';ctx.beginPath();ctx.ellipse(W*.3,H*.3,W*.4,H*.32,.6,0,7);ctx.fill();}if(sec===3){ctx.strokeStyle='#ff38551a';for(let i=0;i<8;i++){ctx.beginPath();const y=(i*120+frame*.7)%(H+120);ctx.moveTo(0,y);ctx.lineTo(W,y-55);ctx.stroke();}}if(sec===4){ctx.strokeStyle='#ffe9a020';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(W/2,H*.2,(i*100+frame*.5)%(W*.9),0,7);ctx.stroke();}}}
function drawEnemy(e){const g=ctx;g.save();g.translate(e.x,e.y);g.shadowBlur=12;g.shadowColor=e.color;g.fillStyle='#121c30';g.strokeStyle=e.color;g.lineWidth=2;g.beginPath();g.moveTo(0,e.r);g.lineTo(-e.r,-e.r*.4);g.lineTo(-e.r*.55,-e.r);g.lineTo(0,-e.r*.65);g.lineTo(e.r*.55,-e.r);g.lineTo(e.r,-e.r*.4);g.closePath();g.fill();g.stroke();g.fillStyle=e.color;g.fillRect(-3,-4,6,9);if(e.type==='frigate'||e.type==='carrier'){g.strokeRect(-e.r*.75,-e.r*.45,e.r*1.5,e.r*.9);}g.restore();if(e.hp<e.maxHp){g.fillStyle='#182336';g.fillRect(e.x-e.r,e.y+e.r+7,e.r*2,3);g.fillStyle=e.color;g.fillRect(e.x-e.r,e.y+e.r+7,e.r*2*clamp(e.hp/e.maxHp,0,1),3);}}
function drawBoss(b){const g=ctx;g.save();g.translate(b.x,b.y);const col=SECTORS[b.sec].color;g.shadowBlur=18;g.shadowColor=col;g.fillStyle='#15213a';g.strokeStyle=col;g.lineWidth=b.major?4:3;g.beginPath();g.moveTo(0,51);g.lineTo(-31,26);g.lineTo(-89,15);g.lineTo(-78,-36);g.lineTo(-29,-38);g.lineTo(0,-52);g.lineTo(29,-38);g.lineTo(78,-36);g.lineTo(89,15);g.lineTo(31,26);g.closePath();g.fill();g.stroke();g.fillStyle='#ff658f';g.fillRect(-16,-19,32,28);g.strokeRect(-24,-27,48,45);if(b.shield){g.strokeStyle='#63f5ff';g.lineWidth=4;g.shadowColor='#00eaff';g.shadowBlur=25;g.beginPath();g.ellipse(0,0,52,56,0,0,Math.PI*2);g.stroke();g.strokeStyle='#6ceeff66';g.beginPath();g.ellipse(0,0,61,64,0,0,Math.PI*2);g.stroke();}for(const t of b.turrets){if(t.hp<=0)continue;g.save();g.translate(t.ox,16);g.fillStyle='#28394e';g.strokeStyle='#ffb36d';g.lineWidth=3;g.beginPath();g.moveTo(0,-25);g.lineTo(21,-10);g.lineTo(20,17);g.lineTo(0,27);g.lineTo(-20,17);g.lineTo(-21,-10);g.closePath();g.fill();g.stroke();g.fillStyle='#ffc982';g.fillRect(-6,-10,12,20);g.fillStyle='#4b2534';g.fillRect(-20,31,40,5);g.fillStyle='#ffc66d';g.fillRect(-20,31,40*clamp(t.hp/t.maxHp,0,1),5);g.restore();}g.restore();}
function render(dt){background(dt);if(!state||!['playing','cards','paused'].includes(mode))return;const s=state;for(const e of s.enemies)drawEnemy(e);if(s.boss)drawBoss(s.boss);for(const b of s.bullets){ctx.save();ctx.shadowBlur=12;ctx.shadowColor=b.color;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,7);ctx.fill();ctx.restore();}for(const b of s.shots){ctx.fillStyle='#ff638e';ctx.shadowBlur=9;ctx.shadowColor='#ff638e';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();}ctx.shadowBlur=0;for(const q of s.particles){ctx.globalAlpha=clamp(q.life/q.max,0,1);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,7);ctx.fill();}ctx.globalAlpha=1;for(const q of s.texts){ctx.globalAlpha=q.life;ctx.fillStyle=q.color;ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(q.text,q.x,q.y);}ctx.globalAlpha=1;for(const [id,lv] of Object.entries(s.weapons)){if(id==='drone'){const count=lv>=4?3:lv>=2?2:1;for(let i=0;i<count;i++){const a=s.time*2+i*6.28/count;ctx.fillStyle='#7dffca';ctx.shadowColor='#7dffca';ctx.shadowBlur=13;ctx.beginPath();ctx.arc(s.player.x+Math.cos(a)*43,s.player.y+Math.sin(a)*35,8,0,7);ctx.fill();}}}ctx.shadowBlur=0;if(s.player.inv<=0||Math.floor(s.time*15)%2===0){shipArt(ctx,s.ship,s.player.x,s.player.y,1,true);}if(s.abilityFlash>0){ctx.strokeStyle=SHIPS[s.ship].color;ctx.globalAlpha=s.abilityFlash;ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.player.x,s.player.y,40+(1-s.abilityFlash)*180,0,7);ctx.stroke();ctx.globalAlpha=1;}}
function loop(t){const dt=Math.min(.04,Math.max(0,(t-last)/1000||0));last=t;if(mode==='playing')update(dt);render(dt);requestAnimationFrame(loop);}
function pause(){if(mode==='playing'){mode='paused';saveRun();show(`<div class="eyebrow">MISSION ${campaign.level}</div><h1>PAUSED</h1><p class="sub">Your progress is saved automatically. Resume now or return to the hangar.</p><div class="btnrow"><button class="btn" id="continue">CONTINUE</button><button class="btn alt" id="hangar">SAVE & HANGAR</button></div>`);$('continue').onclick=()=>{mode='playing';gameUi();last=performance.now();};$('hangar').onclick=()=>{saveRun();hub('Mission saved. Use RESUME MISSION to continue.');};}else if(mode==='paused'){mode='playing';gameUi();last=performance.now();}}
$('pause').onclick=pause;$('special').onclick=ability;canvas.addEventListener('pointerdown',e=>{if(mode!=='playing')return;touchX=e.clientX;canvas.setPointerCapture?.(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(mode==='playing'&&touchX!==null)touchX=e.clientX;});canvas.addEventListener('pointerup',()=>touchX=null);canvas.addEventListener('pointercancel',()=>touchX=null);addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();ability();}if(e.key==='Escape')pause();});addEventListener('keyup',e=>keys[e.key]=false);document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause();});addEventListener('pagehide',saveRun);
load();resize();stars=Array.from({length:120},()=>({x:rand(0,W),y:rand(0,H),speed:rand(15,100),alpha:rand(.15,.85),size:rand(.7,2),color:Math.random()<.13?'#85d8ff':'#ffffff'}));hub();requestAnimationFrame(loop);
</script></body></html>
